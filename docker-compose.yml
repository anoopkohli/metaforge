# Optional alternative to `make pg-up` (Homebrew) for stage 3's pooled RAG index: Postgres 17 +
# pgvector. Point METAFORGE_PG_ADMIN_DSN / METAFORGE_PG_APP_DSN at it (see README).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: metaforge
      POSTGRES_PASSWORD: metaforge-dev-only
      POSTGRES_DB: metaforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
