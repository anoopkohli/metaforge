[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaforge"
version = "0.1.0"
description = "Synthetic multi-tenant, metadata-driven platform used as a testbed for AI features: generation, tool use, RAG, evals and incident triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mcp>=2.3,<3",
]
mcp = [
    "mcp>=2.3,<3",
]
llm = [
    "anthropic>=0.40",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "evals*",
    "generator*",
    "mcp_server*",
    "rag*",
    "triage*",
    "chaos*",
    "attacks*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: calls a real LLM provider; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
