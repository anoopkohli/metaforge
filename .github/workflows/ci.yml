name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: metaforge_admin
          POSTGRES_DB: metaforge
          # Throwaway CI container reachable only from this job; no passwords to manage or leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metaforge_admin -d metaforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      METAFORGE_PG_ADMIN_DSN: host=localhost port=5432 dbname=metaforge user=metaforge_admin
      METAFORGE_PG_APP_DSN: host=localhost port=5432 dbname=metaforge user=metaforge_app
      METAFORGE_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline)
        run: pytest
      - name: Eval regression gate
        run: python -m evals.run
      - name: Upload eval reports
        if: always()
        # Pinned by commit (v7.0.1, April 2026): a moved tag cannot change what runs here.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eval-reports
          path: evals/reports/
          retention-days: 14
          if-no-files-found: warn
